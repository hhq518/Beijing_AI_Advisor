version: "3.8"

services:
  beijing-ai-advisor-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beijing-ai-advisor-ui
    ports:
      - "7860:7860"
    env_file:
      - .env
    restart: unless-stopped

  beijing-ai-advisor-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: beijing-ai-advisor-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
